<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Wes app icon: waveform resolving into a rising tick — speech, coached upward. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#347A50"/>
      <stop offset="1" stop-color="#1F4A31"/>
    </linearGradient>
  </defs>
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bg)"/>
  <!-- waveform bars -->
  <g stroke="#FAF7F0" stroke-width="36" stroke-linecap="round" fill="none">
    <line x1="140" y1="226" x2="140" y2="286"/>
    <line x1="204" y1="186" x2="204" y2="326"/>
    <line x1="268" y1="210" x2="268" y2="302"/>
  </g>
  <!-- rising tick -->
  <path d="M312 296 L342 330 L398 186" stroke="#FAF7F0" stroke-width="36"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
